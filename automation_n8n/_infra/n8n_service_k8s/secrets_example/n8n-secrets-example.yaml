apiVersion: v1
kind: Secret
metadata:
  name: <n8n-secret>
  namespace: <namespace>
type: Opaque
stringData:
  DB_TYPE: postgresdb
  DB_POSTGRES_HOST: <location-of-your-database>.svc.cluster.local
  DB_POSTGRES_PORT: "5432"
  DB_POSTGRES_DATABASE: <database-name>
  DB_POSTGRES_USER: <your-database-username>
  DB_POSTGRES_PASSWORD: <your-database-password>

  # Basic auth for n8n UI
  N8N_BASIC_AUTH_ACTIVE: "true"
  N8N_BASIC_AUTH_USER: <your-admin-username>
  N8N_BASIC_AUTH_PASSWORD: <your-admin-password>
